# .github/workflows/deploy.yml
# CI/CD — Deploy Oracle/APEX/ORDS com GitHub Environments
# M&S do Brasil LTDA — contato@msbrasil.inf.br
#
# Gatilhos:
#   push em develop → dev   (automático)
#   push em hom     → hom   (automático)
#   push em main    → prod  (aguarda aprovação no Environment 'prod')
#   workflow_dispatch       (escolha manual do ambiente)
#
# CONFIGURAÇÃO (Settings → Environments): crie dev, hom e prod.
#   Em prod: "Required reviewers" (aprovação obrigatória) e, se possível,
#   "Deployment branches" = main. Cada Environment tem os SEUS valores:
#
#   Secret (Environment secrets):
#     DB_PASS           senha do usuário de deploy — uma por ambiente
#   Variables (Environment variables):
#     DB_HOST, DB_PORT (padrão 1521), DB_SERVICE, DB_USER
#     DB_SCHEMA         schema alvo, se diferente de DB_USER (opcional)
#     APEX_WORKSPACE, APEX_APP_ID, APEX_SCHEMA (opcional; sem APEX_APP_ID o APEX é pulado)
#     ORDS_HEALTHCHECK_URL  URL pública que deve responder 2xx após o deploy (opcional)
#     ORDS_URL          base dos testes Newman (opcional)
#   Se a política da empresa tratar host/serviço/usuário como sigilosos,
#   mova-os para Environment secrets e troque 'vars.' por 'secrets.' abaixo.
#
# Aprovação: o job 'deploy' referencia o Environment; em prod ele só começa
# depois da aprovação, e por isso o script recebe --confirmar-prod (o
# script nunca pede confirmação interativa em CI).
#
# Dependências do projeto: scripts/ (assets da skill oracle-devops-ptbr) e
# scripts/requirements-devops.txt.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Oracle/APEX/ORDS

on:
  push:
    branches: [develop, hom, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de deploy"
        required: true
        default: dev
        type: choice
        options: [dev, hom, prod]

permissions:
  contents: read

# Um deploy por ambiente de cada vez; nunca cancela um deploy em andamento.
concurrency:
  group: deploy-${{ inputs.environment || github.ref_name }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # Fixe uma versão do SQLcl para builds reproduzíveis (ex.: sqlcl-<versão>.zip).
  SQLCL_URL: https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-latest.zip

jobs:

  # ─── Resolução do ambiente (sem segredos nos outputs) ─────────────────────

  resolve:
    name: Resolver ambiente
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Ambiente pelo input ou pelo branch
        id: env
        env:
          INPUT_ENV: ${{ inputs.environment }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ -n "$INPUT_ENV" ]]; then
            ambiente="$INPUT_ENV"
          else
            case "$BRANCH" in
              main)    ambiente=prod ;;
              hom)     ambiente=hom ;;
              develop) ambiente=dev ;;
              *) echo "Branch '$BRANCH' não mapeado para ambiente"; exit 1 ;;
            esac
          fi
          echo "environment=${ambiente}" >> "$GITHUB_OUTPUT"
          echo "Ambiente: ${ambiente}"

  # ─── Validação offline (não toca no banco) ────────────────────────────────

  validate:
    name: Validar SQL
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências Python
        run: pip install -r scripts/requirements-devops.txt

      - name: Nomenclatura GMUD (db/scripts/NNN_nome.sql)
        run: |
          shopt -s nullglob
          invalidos=()
          for f in db/scripts/*.sql; do
            [[ "$(basename "$f")" =~ ^[0-9]{3}_[A-Za-z0-9_]+\.sql$ ]] || invalidos+=("$f")
          done
          if (( ${#invalidos[@]} )); then
            printf 'ERRO: fora do padrão NNN_nome.sql: %s\n' "${invalidos[@]}"
            exit 1
          fi
          echo "✓ Nomenclatura GMUD validada"

      - name: Changelog e arquivos SQL (UTF-8, literais, terminadores)
        run: |
          if [[ -f db/changelog.yml ]]; then
            python scripts/apply_changelog.py --validar --project-root "$GITHUB_WORKSPACE"
          fi
          python scripts/deploy_db.py --dry-run --project-root "$GITHUB_WORKSPACE"
          if [[ -d ords ]]; then
            python scripts/deploy_ords.py --dry-run --project-root "$GITHUB_WORKSPACE"
          fi

  # ─── Deploy: banco → APEX → ORDS (um job, uma aprovação) ──────────────────

  deploy:
    name: Deploy (${{ needs.resolve.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [resolve, validate]
    environment:
      name: ${{ needs.resolve.outputs.environment }}
    env:
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT || '1521' }}
      DB_SERVICE: ${{ vars.DB_SERVICE }}
      DB_USER: ${{ vars.DB_USER }}
      DB_SCHEMA: ${{ vars.DB_SCHEMA }}
      DB_PASS: ${{ secrets.DB_PASS }}
      APEX_WORKSPACE: ${{ vars.APEX_WORKSPACE }}
      APEX_APP_ID: ${{ vars.APEX_APP_ID }}
      APEX_SCHEMA: ${{ vars.APEX_SCHEMA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar SQLcl
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sqlcl.zip" "$SQLCL_URL"
          unzip -q "$RUNNER_TEMP/sqlcl.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sqlcl/bin" >> "$GITHUB_PATH"

      - name: Instalar dependências Python
        run: pip install -r scripts/requirements-devops.txt

      - name: Deploy completo (changelog → APEX → ORDS)
        run: |
          args=(--env "$ENVIRONMENT" --project-root "$GITHUB_WORKSPACE")
          # Em prod este job só roda depois da aprovação do Environment.
          if [[ "$ENVIRONMENT" == "prod" ]]; then args+=(--confirmar-prod); fi
          if [[ -z "$APEX_APP_ID" || ! -d "apex/app_${APEX_APP_ID}" ]]; then args+=(--skip-apex); fi
          if [[ ! -d ords ]]; then args+=(--skip-ords); fi
          python scripts/deploy_full.py "${args[@]}"

      - name: Estado do changelog
        if: always()
        run: python scripts/apply_changelog.py --status --env "$ENVIRONMENT" --project-root "$GITHUB_WORKSPACE"

      - name: Smoke test (healthcheck)
        env:
          HEALTHCHECK_URL: ${{ vars.ORDS_HEALTHCHECK_URL }}
        run: |
          if [[ -z "$HEALTHCHECK_URL" ]]; then
            echo "ORDS_HEALTHCHECK_URL não definida — pulando"
            exit 0
          fi
          curl -fsS -o /dev/null --retry 3 --retry-delay 5 "$HEALTHCHECK_URL"
          echo "✓ Healthcheck respondeu 2xx"

      - name: Testes de API (Newman, se existirem)
        env:
          ORDS_URL: ${{ vars.ORDS_URL }}
        run: |
          if [[ ! -f tests/api/collection.json ]]; then
            echo "Sem collection Newman — pulando"
            exit 0
          fi
          npm install -g newman
          newman run tests/api/collection.json \
            --env-var "baseUrl=${ORDS_URL}" \
            --reporters cli,junit \
            --reporter-junit-export tests/api/reports/newman-report.xml

  # ─── Tag de versão (somente prod) ─────────────────────────────────────────

  tag-release:
    name: Tag de release
    runs-on: ubuntu-latest
    needs: [resolve, deploy]
    if: needs.resolve.outputs.environment == 'prod'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Criar tag de versão
        run: |
          versao="v$(date '+%Y.%m.%d')-$(git rev-parse --short HEAD)"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "$versao" -m "Release automática — deploy prod $(date '+%Y-%m-%d %H:%M')"
          git push origin "$versao"
          echo "✓ Tag criada: $versao"
