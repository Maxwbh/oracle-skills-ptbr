# .github/workflows/deploy-liquibase.yml
# Deploy GMUD via Liquibase com approval gates por GitHub Environment.
#
# COMO OS GATILHOS SE MATERIALIZAM (Aprovar / Reprovar / HML / PRD):
#   No GitHub, crie 3 Environments: dev, hml, prd
#   (Settings > Environments). Em hml e prd, configure "Required reviewers".
#   - "Aprovar"            = reviewer aprova o deployment pendente do environment.
#   - "Reprovar"           = reviewer rejeita -> o job falha e nada é aplicado.
#   - "Enviar p/ HML"      = aprovar o gate do environment hml.
#   - "Enviar p/ PRD"      = aprovar o gate do environment prd.
#   O code review do CÓDIGO continua no Pull Request (required approvals na
#   branch protection); este workflow cuida da PROMOÇÃO entre ambientes.
#
# ESTRATÉGIA DE ENTREGA AO BANCO (escolha 1 por projeto — ver reference):
#   A) Runner hospedado conecta direto no banco (só se a rede permitir).
#   B) Runner self-hosted DENTRO da rede do banco (recomendado p/ PRD).
#   C) Workflow só valida/monta o pacote; DBA aplica manualmente (Git não toca
#      o banco) — use update-sql para gerar o script e publicá-lo como artefato.
#
# Segredos por environment (Settings > Environments > <env> > Secrets):
#   DB_URL, DB_USER, DB_PASSWORD  (nunca no código; escopo por environment)
#   Secrets de Environment só existem em jobs que declaram 'environment:' —
#   por isso tudo que conecta no banco roda dentro dos jobs de deploy.
#   As credenciais chegam ao Liquibase por LIQUIBASE_COMMAND_* (variáveis de
#   ambiente), nunca na linha de comando.
#
# Liquibase 4.33.0 (Community) já traz o driver Oracle (ojdbc8). A partir do
# 5.0 a edição Community não traz drivers: instale com 'liquibase lpm add ...'
# (ver README do liquibase/setup-liquibase).

name: deploy-liquibase

on:
  workflow_dispatch:        # disparo manual com escolha de ambiente
    inputs:
      ambiente:
        description: "Ambiente alvo"
        type: choice
        options: [dev, hml, prd]
        required: true
  push:
    branches: [develop]     # merge em develop -> deploy automático em dev

permissions:
  contents: read

env:
  LIQUIBASE_VERSION: "4.33.0"
  LIQUIBASE_COMMAND_CHANGELOG_FILE: db/changelog-master.xml

jobs:
  # ---------------------------------------------------------------------------
  # 1) VALIDAÇÃO OFFLINE — sempre roda, sem tocar o banco.
  #    O 'liquibase validate' exige conexão; ele roda dentro de cada deploy.
  # ---------------------------------------------------------------------------
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: XML bem-formado e arquivos referenciados existem
        run: python scripts/gmud_liquibase.py verificar --root db

  # ---------------------------------------------------------------------------
  # 2) DEV — automático após merge em develop (sem gate).
  # ---------------------------------------------------------------------------
  deploy-dev:
    needs: validar
    # push (só em develop) ou disparo manual escolhendo dev — nunca os dois.
    if: github.event_name == 'push' || inputs.ambiente == 'dev'
    runs-on: ubuntu-latest
    environment: dev          # sem required reviewers
    env:
      LIQUIBASE_COMMAND_URL: ${{ secrets.DB_URL }}
      LIQUIBASE_COMMAND_USERNAME: ${{ secrets.DB_USER }}
      LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: liquibase/setup-liquibase@v3
        with:
          version: ${{ env.LIQUIBASE_VERSION }}
          edition: community
      - name: Validar changelog no banco
        run: liquibase validate
      - name: SQL previsto (update-sql)
        run: liquibase --contexts=dev update-sql > deploy-previsto-dev.sql
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-previsto-dev
          path: deploy-previsto-dev.sql
      - name: Liquibase update (context dev)
        run: liquibase --contexts=dev update

  # ---------------------------------------------------------------------------
  # 3) HML — exige aprovação do environment "hml" (Enviar p/ HML).
  # ---------------------------------------------------------------------------
  deploy-hml:
    needs: validar
    if: inputs.ambiente == 'hml'
    runs-on: ubuntu-latest    # ou self-hosted, conforme estratégia B
    environment: hml          # required reviewers = approval gate
    env:
      LIQUIBASE_COMMAND_URL: ${{ secrets.DB_URL }}
      LIQUIBASE_COMMAND_USERNAME: ${{ secrets.DB_USER }}
      LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: liquibase/setup-liquibase@v3
        with:
          version: ${{ env.LIQUIBASE_VERSION }}
          edition: community
      - name: Validar changelog no banco
        run: liquibase validate
      - name: SQL previsto (update-sql)
        run: liquibase --contexts=hml update-sql > deploy-previsto-hml.sql
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-previsto-hml
          path: deploy-previsto-hml.sql
      - name: Liquibase update (context hml)
        run: liquibase --contexts=hml update

  # ---------------------------------------------------------------------------
  # 4) PRD — exige aprovação do environment "prd" (Enviar p/ PRD).
  #     Estratégia B (self-hosted) ou C (gerar SQL p/ DBA) recomendadas aqui.
  # ---------------------------------------------------------------------------
  deploy-prd:
    needs: validar
    if: inputs.ambiente == 'prd'
    runs-on: ubuntu-latest    # troque por [self-hosted, oracle-prd] na estratégia B
    environment: prd
    env:
      LIQUIBASE_COMMAND_URL: ${{ secrets.DB_URL }}
      LIQUIBASE_COMMAND_USERNAME: ${{ secrets.DB_USER }}
      LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: liquibase/setup-liquibase@v3
        with:
          version: ${{ env.LIQUIBASE_VERSION }}
          edition: community
      - name: Validar changelog no banco
        run: liquibase validate

      # Estratégia C: NÃO aplica; gera o script e publica para o DBA aplicar.
      - name: Gerar script GMUD para o DBA (estratégia C)
        run: liquibase --contexts=prd update-sql > gmud-prd.sql
      - uses: actions/upload-artifact@v4
        with:
          name: gmud-prd-sql
          path: gmud-prd.sql

      # Estratégias A/B: aplicar de fato (descomente quando a rede permitir).
      # - name: Liquibase update (context prd)
      #   run: liquibase --contexts=prd update
