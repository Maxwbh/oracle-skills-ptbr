# Configuração de ferramentas de qualidade (lint e testes) do repositório.
[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["dist", ".build_tmp"]

[tool.ruff.lint]
# Erros reais e imports; sem regras de estilo opinativas.
select = ["E4", "E7", "E9", "F", "I", "B", "PLW1510"]

[tool.ruff.lint.isort]
known-first-party = ["oracle_devops_utils", "apply_changelog", "deploy_full", "deploy_db", "deploy_ords"]
